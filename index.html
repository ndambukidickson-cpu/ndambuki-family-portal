<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>The Ndambuki Family Portal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://cdnjs.cloudflare.com">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        :root {
            --earth-dark: #4A3525;
            --earth-hover: #38271b;
            --earth-accent: #D4AF37;
            --bg-cream: #F9F6F0;
            --surface-white: #FFFFFF;
            --text-main: #2C221E;
            --text-muted: #665c56;
            --border-light: #E5DBCD;
            --shadow: 0 4px 20px rgba(74, 53, 37, 0.08);
            --radius: 12px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: var(--bg-cream); color: var(--text-main); line-height: 1.6; }

        header { background-color: var(--earth-dark); color: white; padding: 1.8rem 1rem; text-align: center; box-shadow: var(--shadow); border-bottom: 3px solid var(--earth-accent); }
        header h1 { font-family: 'Cinzel', serif; font-size: 1.8rem; font-weight: 700; color: var(--earth-accent); margin-bottom: 0.2rem; }
        header p { font-size: 0.85rem; opacity: 0.9; }

        nav { background: var(--earth-dark); border-bottom: 1px solid rgba(255,255,255,0.1); position: sticky; top: 0; z-index: 100; display: flex; justify-content: center; gap: 0.4rem; padding: 0.5rem; overflow-x: auto; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        nav::-webkit-scrollbar { display: none; }
        nav button { background: transparent; border: none; font-family: 'Plus Jakarta Sans', sans-serif; font-size: 0.82rem; font-weight: 600; color: #E5DBCD; cursor: pointer; padding: 0.4rem 0.8rem; border-radius: 8px; white-space: nowrap; display: flex; align-items: center; gap: 0.3rem; }
        nav button:hover { background: rgba(255,255,255,0.1); color: white; }
        nav button.active { background: var(--earth-accent); color: var(--earth-dark); font-weight: 700; }

        .container { max-width: 1200px; margin: 1rem auto; padding: 0 0.8rem; }
        .section { display: none; }
        .section.active { display: block; }

        .controls-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; gap: 0.8rem; flex-wrap: wrap; background: var(--surface-white); padding: 0.8rem; border-radius: var(--radius); border: 1px solid var(--border-light); box-shadow: var(--shadow); }
        .search-box { flex: 1; min-width: 200px; position: relative; }
        .search-box i { position: absolute; left: 0.8rem; top: 50%; transform: translateY(-50%); color: var(--text-muted); }
        .search-box input { width: 100%; padding: 0.6rem 0.8rem 0.6rem 2.4rem; border: 1px solid var(--border-light); border-radius: 8px; font-size: 0.9rem; outline: none; background: #FAF8F5; }
        .search-box input:focus { background: white; border-color: var(--earth-dark); }

        .btn-group { display: flex; gap: 0.4rem; flex-wrap: wrap; }
        .btn { background: var(--earth-dark); color: white; border: none; padding: 0.6rem 1rem; border-radius: 8px; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 0.4rem; font-size: 0.85rem; }
        .btn:hover { background: var(--earth-hover); }
        .btn-secondary { background: var(--earth-accent); color: var(--earth-dark); }

        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 1rem; }
        .card { background: var(--surface-white); border-radius: var(--radius); overflow: hidden; border: 1px solid var(--border-light); box-shadow: var(--shadow); display: flex; flex-direction: column; cursor: pointer; border-top: 4px solid var(--earth-dark); }
        .card-img { height: 130px; background: #EFE9DE; display: flex; align-items: center; justify-content: center; color: var(--text-muted); font-size: 2rem; position: relative; overflow: hidden; }
        .card-img img { width: 100%; height: 100%; object-fit: cover; }
        .badge { position: absolute; top: 8px; right: 8px; background: rgba(74,53,37,0.85); color: white; padding: 0.2rem 0.5rem; border-radius: 20px; font-size: 0.7rem; font-weight: 600; }
        .card-body { padding: 0.9rem; flex: 1; display: flex; flex-direction: column; justify-content: space-between; }
        .card-title { font-family: 'Cinzel', serif; font-size: 1rem; font-weight: 700; color: var(--text-main); margin-bottom: 0.2rem; }
        .card-sub { font-size: 0.78rem; color: var(--text-muted); margin-bottom: 0.4rem; }
        .card-meta { font-size: 0.75rem; color: var(--earth-dark); border-top: 1px solid var(--border-light); padding-top: 0.4rem; margin-top: 0.4rem; }

        .tree-container { background: var(--surface-white); padding: 1.2rem; border-radius: var(--radius); border: 1px solid var(--border-light); box-shadow: var(--shadow); }
        .gen-group { margin-bottom: 1.5rem; }
        .gen-title { font-family: 'Cinzel', serif; font-size: 1.05rem; font-weight: 700; color: var(--earth-dark); border-bottom: 2px solid var(--border-light); padding-bottom: 0.3rem; margin-bottom: 0.8rem; }
        .tree-nodes { display: flex; gap: 0.6rem; flex-wrap: wrap; }
        .tree-node { background: var(--surface-white); border: 1px solid var(--border-light); padding: 0.6rem; border-radius: 8px; min-width: 170px; cursor: pointer; }

        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(44,34,30,0.6); z-index: 1000; align-items: center; justify-content: center; padding: 0.8rem; }
        .modal.active { display: flex; }
        .modal-content { background: var(--surface-white); width: 100%; max-width: 480px; border-radius: var(--radius); overflow: hidden; box-shadow: 0 25px 50px rgba(0,0,0,0.25); max-height: 85vh; display: flex; flex-direction: column; }
        .modal-header { background: var(--earth-dark); color: white; padding: 0.8rem 1rem; display: flex; justify-content: space-between; align-items: center; }
        .modal-header h3 { font-family: 'Cinzel', serif; font-size: 1rem; }
        .modal-close { background: none; border: none; color: white; font-size: 1.2rem; cursor: pointer; }
        .modal-body { padding: 1rem; overflow-y: auto; flex: 1; }
        .modal-footer { padding: 0.6rem 1rem; background: #FAF8F5; border-top: 1px solid var(--border-light); display: flex; justify-content: flex-end; gap: 0.6rem; }

        .form-group { margin-bottom: 0.8rem; }
        .form-group label { display: block; font-weight: 600; margin-bottom: 0.2rem; font-size: 0.78rem; color: var(--earth-dark); }
        .form-control { width: 100%; padding: 0.6rem; border: 1px solid var(--border-light); border-radius: 8px; font-size: 0.9rem; background: #FAF8F5; outline: none; }
        .form-control:focus { background: white; border-color: var(--earth-dark); }

        #saveToast { position: fixed; bottom: 15px; right: 15px; background: var(--earth-dark); color: var(--earth-accent); padding: 0.5rem 0.9rem; border-radius: 8px; font-weight: 600; font-size: 0.8rem; display: none; z-index: 2000; border: 1px solid var(--earth-accent); }
        footer { text-align: center; padding: 2rem; color: var(--text-muted); font-size: 0.75rem; border-top: 1px solid var(--border-light); margin-top: 2rem; background: var(--surface-white); }
    </style>
</head>
<body>

    <header>
        <h1>The Ndambuki Family</h1>
        <p>Mobile Portal • Generations 1 to 5</p>
    </header>

    <nav>
        <button class="active" onclick="switchTab('directory', event)"><i class="fa-solid fa-users"></i> Directory</button>
        <button onclick="switchTab('tree', event)"><i class="fa-solid fa-sitemap"></i> Tree</button>
        <button onclick="switchTab('roots', event)"><i class="fa-solid fa-seedling"></i> Roots</button>
        <button onclick="switchTab('guestbook', event)"><i class="fa-solid fa-book"></i> Notes</button>
    </nav>

    <div class="container">
        <!-- DIRECTORY -->
        <div id="directory" class="section active">
            <div class="controls-bar">
                <div class="search-box">
                    <i class="fa-solid fa-search"></i>
                    <input type="text" id="searchInput" placeholder="Search relatives..." oninput="filterDirectory()">
                </div>
                <div class="btn-group">
                    <input type="file" id="excelInput" accept=".xlsx, .xls" style="display:none;" onchange="importExcel(event)">
                    <button class="btn btn-secondary" onclick="document.getElementById('excelInput').click()"><i class="fa-solid fa-file-excel"></i> Upload</button>
                    <button class="btn" onclick="openAddModal()"><i class="fa-solid fa-user-plus"></i> Add</button>
                </div>
            </div>
            <div id="familyGrid" class="grid"><p style="grid-column: 1/-1; text-align: center; padding: 2rem; color: var(--text-muted);">Loading family members...</p></div>
        </div>

        <!-- TREE -->
        <div id="tree" class="section">
            <div class="controls-bar">
                <h3 style="font-family: 'Cinzel', serif; font-size: 0.9rem; color: var(--earth-dark);">Hierarchy Tree</h3>
                <div class="btn-group">
                    <button class="btn btn-secondary" onclick="exportExcel()"><i class="fa-solid fa-file-excel"></i> Excel</button>
                    <button class="btn btn-secondary" onclick="exportData()"><i class="fa-solid fa-download"></i> JSON</button>
                </div>
            </div>
            <div class="tree-container" id="treeContainer"></div>
        </div>

        <!-- ROOTS -->
        <div id="roots" class="section">
            <div style="background: var(--surface-white); padding: 1.2rem; border-radius: var(--radius); border: 1px solid var(--border-light); box-shadow: var(--shadow);">
                <h2 style="font-family: 'Cinzel', serif; font-size: 1.05rem; font-weight: 700; color: var(--earth-dark); margin-bottom: 0.5rem;">Foundational Ancestors & Branches</h2>
                <div class="grid" id="rootsGrid" style="margin-top: 1rem;"></div>
            </div>
        </div>

        <!-- GUESTBOOK -->
        <div id="guestbook" class="section">
            <div style="background: var(--surface-white); padding: 1.2rem; border-radius: var(--radius); border: 1px solid var(--border-light); box-shadow: var(--shadow); margin-bottom: 1rem;">
                <h3 style="font-family: 'Cinzel', serif; color: var(--earth-dark); margin-bottom: 0.5rem;">Family Note</h3>
                <form onsubmit="addGuest(event)">
                    <div class="form-group"><input type="text" id="gName" class="form-control" placeholder="Your Name" required></div>
                    <div class="form-group"><textarea id="gMsg" class="form-control" rows="2" placeholder="Your message..." required></textarea></div>
                    <button type="submit" class="btn" style="width: 100%;">Post Message</button>
                </form>
            </div>
            <div id="guestGrid" class="grid"></div>
        </div>
    </div>

    <!-- MEMBER MODAL -->
    <div id="memberModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="mModalTitle">Details</h3>
                <button class="modal-close" onclick="closeModal('memberModal')">&times;</button>
            </div>
            <div class="modal-body" id="mModalBody"></div>
            <div class="modal-footer">
                <button class="btn btn-secondary" id="mEditBtn">Edit</button>
                <button class="btn" onclick="closeModal('memberModal')">Close</button>
            </div>
        </div>
    </div>

    <!-- ADD/EDIT MODAL -->
    <div id="formModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="fModalTitle">Add Member</h3>
                <button class="modal-close" onclick="closeModal('formModal')">&times;</button>
            </div>
            <div class="modal-body">
                <form id="memberForm" onsubmit="saveMember(event)">
                    <input type="hidden" id="editId">
                    <div class="form-group"><label>Full Name</label><input type="text" id="fName" class="form-control" required></div>
                    <div class="form-group"><label>Generation</label>
                        <select id="fGen" class="form-control">
                            <option value="Gen 1">Gen 1 (Founders)</option>
                            <option value="Gen 2">Gen 2</option>
                            <option value="Gen 3">Gen 3 (Branch Heads)</option>
                            <option value="Gen 4">Gen 4 (Children)</option>
                            <option value="Gen 5">Gen 5 (Grandchildren)</option>
                        </select>
                    </div>
                    <div class="form-group"><label>Branch</label><input type="text" id="fBranch" class="form-control" placeholder="e.g. Mang'uu Branch"></div>
                    <div class="form-group"><label>Role</label><input type="text" id="fRole" class="form-control" placeholder="e.g. Branch Head"></div>
                    <div class="form-group"><label>Parents</label><input type="text" id="fParents" class="form-control" placeholder="Parents' names"></div>
                    <div class="form-group"><label>Spouse</label><input type="text" id="fSpouse" class="form-control" placeholder="Spouse name"></div>
                    <div class="form-group"><label>Date of Birth</label><input type="date" id="fDob" class="form-control"></div>
                    <div class="form-group"><label>Date of Death</label><input type="date" id="fDod" class="form-control"></div>
                    <div class="form-group"><label>Biography</label><textarea id="fBio" class="form-control" rows="2" placeholder="History..."></textarea></div>
                    <div class="form-group"><label>Photo</label><input type="file" id="fPhoto" class="form-control" accept="image/*"></div>
                    <button type="submit" class="btn" style="width: 100%;">Save Member</button>
                </form>
            </div>
        </div>
    </div>

    <div id="saveToast"><i class="fa-solid fa-cloud"></i> Saved locally</div>

    <footer>
        <p>&copy; 2026 The Ndambuki Family Mobile Portal</p>
    </footer>

    <script>
        let members = [];
        let guestbook = JSON.parse(localStorage.getItem('ndambuki_guestbook_v13')) || [
            { name: "Dickson Ndambuki", msg: "Welcome to our family portal!", date: "2026-10-21" }
        ];

        async function initApp() {
            const saved = localStorage.getItem('ndambuki_members_v13');
            if (saved) {
                members = JSON.parse(saved);
                renderDirectory();
            } else {
                try {
                    const response = await fetch('members.json');
                    members = await response.json();
                    saveData(false);
                    renderDirectory();
                } catch (e) {
                    members = [];
                    document.getElementById('familyGrid').innerHTML = `<p style="grid-column: 1/-1; text-align: center; color: #c5221f; padding: 2rem;">Please upload your members.json or Excel file.</p>`;
                }
            }
        }

        function saveData(toast = true) {
            localStorage.setItem('ndambuki_members_v13', JSON.stringify(members));
            localStorage.setItem('ndambuki_guestbook_v13', JSON.stringify(guestbook));
            if(toast) showToast();
        }

        function showToast() {
            const toast = document.getElementById('saveToast');
            toast.style.display = 'block';
            setTimeout(() => toast.style.display = 'none', 1500);
        }

        function switchTab(tabId, e) {
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            if(e) e.currentTarget.classList.add('active');
            if(tabId === 'directory') renderDirectory();
            if(tabId === 'tree') renderTree();
            if(tabId === 'roots') renderRoots();
            if(tabId === 'guestbook') renderGuest();
        }

        // Helper to cleanly parse and keep the inputted date string exact without timezone shifting
        function formatDateDisplay(dateStr) {
            if (!dateStr) return '';
            // If it's stored as YYYY-MM-DD, extract components directly to avoid time zone alterations
            const parts = dateStr.split('T')[0].split('-');
            if (parts.length === 3) {
                const [year, month, day] = parts;
                const dateObj = new Date(year, month - 1, day);
                // Check if valid date
                if (!isNaN(dateObj)) {
                    return dateObj.toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' });
                }
            }
            return dateStr;
        }

        function renderDirectory(list = members) {
            const grid = document.getElementById('familyGrid');
            grid.innerHTML = '';
            if(list.length === 0) {
                grid.innerHTML = `<p style="grid-column: 1/-1; text-align: center; padding: 2rem; color: var(--text-muted);">No members found.</p>`;
                return;
            }
            list.forEach(m => {
                const card = document.createElement('div');
                card.className = 'card';
                card.onclick = () => openMember(m.id);
                
                const formattedDob = formatDateDisplay(m.dob);
                const formattedDod = formatDateDisplay(m.dod);

                card.innerHTML = `
                    <div class="card-img">
                        ${m.photo ? `<img src="${m.photo}" alt="${m.fullName}">` : `<i class="fa-solid fa-user"></i>`}
                        <div class="badge">${m.generation}</div>
                    </div>
                    <div class="card-body">
                        <div>
                            <div class="card-title">${m.fullName}</div>
                            <div class="card-sub">${m.role || 'Member'} • ${m.branch || 'General'}</div>
                            <div class="card-meta">
                                <div><b>Parents:</b> ${m.parents || 'N/A'}</div>
                                ${formattedDob ? `<div><b>Born:</b> ${formattedDob}</div>` : ''}
                                ${formattedDod ? `<div style="color: #c5221f;"><b>Passed:</b> ${formattedDod}</div>` : ''}
                            </div>
                        </div>
                        <div style="margin-top: 0.5rem; color: var(--earth-dark); font-size: 0.75rem; font-weight: 600;">View Profile &rarr;</div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function filterDirectory() {
            const q = document.getElementById('searchInput').value.toLowerCase().trim();
            const filtered = members.filter(m => 
                m.fullName.toLowerCase().includes(q) || 
                (m.branch && m.branch.toLowerCase().includes(q)) ||
                (m.role && m.role.toLowerCase().includes(q)) ||
                (m.generation && m.generation.toLowerCase().includes(q))
            );
            renderDirectory(filtered);
        }

        function renderTree() {
            const container = document.getElementById('treeContainer');
            container.innerHTML = '';
            ["Gen 1", "Gen 2", "Gen 3", "Gen 4", "Gen 5"].forEach(gen => {
                const genMembers = members.filter(m => m.generation === gen);
                if(genMembers.length === 0) return;
                const group = document.createElement('div');
                group.className = 'gen-group';
                group.innerHTML = `<div class="gen-title">${gen} (${genMembers.length})</div>`;
                const nodes = document.createElement('div');
                nodes.className = 'tree-nodes';
                genMembers.forEach(m => {
                    const node = document.createElement('div');
                    node.className = 'tree-node';
                    node.onclick = () => openMember(m.id);
                    node.innerHTML = `
                        <h4 style="font-size:0.8rem; font-weight:700;">${m.fullName}</h4>
                        <p style="font-size:0.68rem; color:var(--text-muted);">${m.branch || ''}</p>
                    `;
                    nodes.appendChild(node);
                });
                group.appendChild(nodes);
                container.appendChild(group);
            });
        }

        function renderRoots() {
            const grid = document.getElementById('rootsGrid');
            const branches = [...new Set(members.map(m => m.branch))].filter(b => b);
            grid.innerHTML = '';
            branches.forEach(b => {
                const count = members.filter(m => m.branch === b).length;
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `<div class="card-body"><div class="card-title">${b}</div><div class="card-sub">${count} Members</div></div>`;
                grid.appendChild(card);
            });
        }

        function renderGuest() {
            const grid = document.getElementById('guestGrid');
            grid.innerHTML = '';
            guestbook.forEach(g => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `<div class="card-body"><div class="card-title">${g.name}</div><div class="card-sub">${g.date}</div><p style="font-size:0.78rem; color:var(--text-muted);">${g.msg}</p></div>`;
                grid.appendChild(card);
            });
        }

        function addGuest(e) {
            e.preventDefault();
            const name = document.getElementById('gName').value;
            const msg = document.getElementById('gMsg').value;
            guestbook.unshift({ name, msg, date: new Date().toISOString().split('T')[0] });
            saveData(true);
            renderGuest();
            document.getElementById('gName').value = '';
            document.getElementById('gMsg').value = '';
        }

        function openMember(id) {
            const m = members.find(item => item.id === id);
            if(!m) return;
            
            const formattedDob = formatDateDisplay(m.dob);
            const formattedDod = formatDateDisplay(m.dod);

            document.getElementById('mModalTitle').innerText = m.fullName;
            document.getElementById('mModalBody').innerHTML = `
                <div style="text-align: center; margin-bottom: 0.8rem;">
                    ${m.photo ? `<img src="${m.photo}" style="width: 75px; height: 75px; border-radius: 50%; object-fit: cover; border: 2px solid var(--earth-dark);" alt="${m.fullName}">` : `<div style="font-size: 2rem; color: var(--earth-dark);"><i class="fa-solid fa-user-circle"></i></div>`}
                </div>
                <p><b>Generation:</b> ${m.generation}</p>
                <p><b>Branch:</b> ${m.branch || 'N/A'}</p>
                <p><b>Role:</b> ${m.role || 'Member'}</p>
                <p><b>Parents:</b> ${m.parents || 'N/A'}</p>
                <p><b>Spouse:</b> ${m.spouse || 'N/A'}</p>
                ${formattedDob ? `<p><b>Born:</b> ${formattedDob}</p>` : ''}
                ${formattedDod ? `<p style="color: #c5221f;"><b>Passed:</b> ${formattedDod}</p>` : ''}
                <hr style="margin: 0.6rem 0; border:0; border-top:1px solid var(--border-light);">
                <h4 style="font-family: 'Cinzel', serif; font-size:0.85rem; font-weight:700; color:var(--earth-dark);">Biography</h4>
                <p style="background: #FAF8F5; padding: 0.6rem; border-radius: 6px; margin-top: 0.3rem; font-size:0.82rem;">${m.bio || 'No biography written yet.'}</p>
            `;
            document.getElementById('mEditBtn').onclick = () => openEdit(m.id);
            document.getElementById('memberModal').classList.add('active');
        }

        function openAddModal() {
            document.getElementById('fModalTitle').innerText = "Add Family Member";
            document.getElementById('memberForm').reset();
            document.getElementById('editId').value = '';
            document.getElementById('formModal').classList.add('active');
        }

        function openEdit(id) {
            closeModal('memberModal');
            const m = members.find(item => item.id === id);
            if(!m) return;
            document.getElementById('fModalTitle').innerText = "Edit Member";
            document.getElementById('editId').value = m.id;
            document.getElementById('fName').value = m.fullName || '';
            document.getElementById('fGen').value = m.generation || 'Gen 3';
            document.getElementById('fBranch').value = m.branch || '';
            document.getElementById('fRole').value = m.role || '';
            document.getElementById('fParents').value = m.parents || '';
            document.getElementById('fSpouse').value = m.spouse || '';
            document.getElementById('fDob').value = m.dob ? m.dob.split('T')[0] : '';
            document.getElementById('fDod').value = m.dod ? m.dod.split('T')[0] : '';
            document.getElementById('fBio').value = m.bio || '';
            document.getElementById('formModal').classList.add('active');
        }

        function saveMember(e) {
            e.preventDefault();
            const id = document.getElementById('editId').value;
            const fileInput = document.getElementById('fPhoto');

            const save = (photoUrl) => {
                const data = {
                    id: id ? parseInt(id) : Date.now(),
                    fullName: document.getElementById('fName').value,
                    generation: document.getElementById('fGen').value,
                    branch: document.getElementById('fBranch').value,
                    role: document.getElementById('fRole').value,
                    parents: document.getElementById('fParents').value,
                    spouse: document.getElementById('fSpouse').value,
                    dob: document.getElementById('fDob').value,
                    dod: document.getElementById('fDod').value,
                    bio: document.getElementById('fBio').value,
                    photo: photoUrl || (id ? members.find(m => m.id == id).photo : null)
                };

                if(id) {
                    const idx = members.findIndex(m => m.id == id);
                    if(idx !== -1) members[idx] = data;
                } else {
                    members.push(data);
                }

                saveData(true);
                closeModal('formModal');
                renderDirectory();
            };

            if(fileInput.files && fileInput.files[0]) {
                const reader = new FileReader();
                reader.onload = (e) => save(e.target.result);
                reader.readAsDataURL(fileInput.files[0]);
            } else {
                save(null);
            }
        }

        function importExcel(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const data = new Uint8Array(e.target.result);
                    const workbook = XLSX.read(data, { type: 'array' });
                    const firstSheet = workbook.SheetNames[0];
                    const worksheet = workbook.Sheets[firstSheet];
                    const jsonRows = XLSX.utils.sheet_to_json(worksheet);

                    members = jsonRows.map((row, index) => ({
                        id: row['ID'] || index + 1,
                        generation: row['Generation'] || 'Gen 3',
                        fullName: row['Full Name'] || 'Unknown',
                        role: row['Role / Relationship'] || 'Member',
                        branch: row['Branch'] || 'General',
                        parents: row['Parents'] || '',
                        spouse: row['Spouse'] || '',
                        dob: row['Date of Birth'] ? String(row['Date of Birth']).split('T')[0] : '',
                        dod: row['Death Date'] ? String(row['Death Date']).split('T')[0] : '',
                        bio: row['Biography'] || `Imported from Excel.`
                    }));

                    saveData(true);
                    renderDirectory();
                    alert(`Successfully imported ${members.length} members!`);
                } catch(err) {
                    alert("Error reading Excel file.");
                }
            };
            reader.readAsArrayBuffer(file);
        }

        function exportExcel() {
            const exportDataRows = members.map(m => ({
                'ID': m.id,
                'Full Name': m.fullName,
                'Generation': m.generation,
                'Branch': m.branch,
                'Role / Relationship': m.role,
                'Parents': m.parents,
                'Spouse': m.spouse,
                'Date of Birth': m.dob || '',
                'Death Date': m.dod || '',
                'Biography': m.bio
            }));

            const worksheet = XLSX.utils.json_to_sheet(exportDataRows);
            const workbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(workbook, worksheet, "Family Members");
            XLSX.writeFile(workbook, "ndambuki_family_tree.xlsx");
        }

        function closeModal(modalId) {
            document.getElementById(modalId).classList.remove('active');
        }

        function exportData() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(members, null, 2));
            const a = document.createElement('a');
            a.href = dataStr;
            a.download = "ndambuki_family_backup.json";
            a.click();
        }

        initApp();
    </script>
</body>
</html>
